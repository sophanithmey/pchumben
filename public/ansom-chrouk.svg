<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Banana Leaf Gradients -->
    <linearGradient id="bananaLeafBody" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2c5324" />
      <stop offset="25%" stopColor="#417734" />
      <stop offset="50%" stopColor="#5d9647" />
      <stop offset="75%" stopColor="#437a35" />
      <stop offset="100%" stopColor="#274c20" />
    </linearGradient>

    <!-- Cylinder Longitudinal 3D Lighting -->
    <linearGradient id="cylinderShading" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ffffff" stop-opacity="0.3" />
      <stop offset="35%" stopColor="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stopColor="#000000" stop-opacity="0.15" />
      <stop offset="100%" stopColor="#000000" stop-opacity="0.45" />
    </linearGradient>

    <!-- Folded Leaf Cap Gradient -->
    <linearGradient id="leafCapLeft" x1="25" y1="50" x2="55" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1f3d19" />
      <stop offset="60%" stopColor="#3b6e2f" />
      <stop offset="100%" stopColor="#2b5222" />
    </linearGradient>

    <linearGradient id="leafCapRight" x1="145" y1="165" x2="175" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#35652a" />
      <stop offset="50%" stopColor="#4c863b" />
      <stop offset="100%" stopColor="#203f1a" />
    </linearGradient>

    <!-- Bamboo Tie (ខ្សែបន្ទះឫស្សី) Gradient -->
    <linearGradient id="bambooString" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#f3dd98" />
      <stop offset="40%" stopColor="#d8ab4e" />
      <stop offset="85%" stopColor="#a37628" />
      <stop offset="100%" stopColor="#7a5518" />
    </linearGradient>

    <!-- Cross Section Fill Gradients -->
    <radialGradient id="riceCrossSection" cx="70%" cy="40%" r="65%">
      <stop offset="0%" stopColor="#fcf9ee" />
      <stop offset="60%" stopColor="#eae3cb" />
      <stop offset="100%" stopColor="#c5baa0" />
    </radialGradient>

    <radialGradient id="mungBeanPaste" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="65%" stopColor="#eab308" />
      <stop offset="100%" stopColor="#ca8a04" />
    </radialGradient>

    <radialGradient id="porkBellyCore" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#fed7aa" />
      <stop offset="45%" stopColor="#f97316" />
      <stop offset="75%" stopColor="#9a3412" />
      <stop offset="100%" stopColor="#581c87" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowFilter" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#2d2215" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#shadowFilter)">
    <!-- 1. Left Folded Leaf End & Tying String (ចុងស្លឹកចេកបត់) -->
    <!-- Hanging Bamboo String Loop Left -->
    <path d="M38 52 C26 44 14 42 16 32 C18 24 28 26 34 36 C36 40 37 46 39 49" 
          stroke="url(#bambooString)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M36 46 C28 32 18 20 22 16 C26 12 34 18 40 34" 
          stroke="#b28135" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Left Folded Banana Leaf Tip -->
    <path d="M48 64 L26 44 C24 41 25 36 29 34 L45 28 C49 26 53 28 55 32 L65 52 Z" 
          fill="url(#leafCapLeft)" stroke="#1a3415" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Leaf Fold Crease Lines Left -->
    <path d="M29 34 L56 46" stroke="#162e12" stroke-width="1.5" opacity="0.7" />
    <path d="M38 29 L50 49" stroke="#5d9647" stroke-width="1" opacity="0.5" />

    <!-- 2. Main Cylindrical Banana-Leaf Body (តួអន្សមរាងមូលទ្រវែង) -->
    <!-- Diagonal cylinder from top-left (approx 52, 42) to bottom-right (approx 150, 140) -->
    <path d="M48 64 C42 57 44 48 53 39 C62 30 71 28 78 35 
             L158 115 C165 122 163 131 154 140 C145 149 136 151 129 144 Z"
          fill="url(#bananaLeafBody)" />

    <!-- 3. Fine Banana Leaf Fibers & Veins (សរសៃស្លឹកចេក) -->
    <g stroke="#3a692e" stroke-width="0.8" opacity="0.6">
      <path d="M58 48 L138 128" />
      <path d="M66 44 L146 124" />
      <path d="M74 40 L154 120" stroke="#7bb862" stroke-width="1" opacity="0.4" />
      <path d="M52 56 L132 136" />
    </g>

    <!-- Translucent 3D Curved Light/Shade Layer -->
    <path d="M48 64 C42 57 44 48 53 39 C62 30 71 28 78 35 
             L158 115 C165 122 163 131 154 140 C145 149 136 151 129 144 Z"
          fill="url(#cylinderShading)" />

    <!-- 4. Right Folded Leaf End & Bamboo Tie Tail (កន្ទុយស្លឹកចេក) -->
    <path d="M142 128 L168 152 C172 155 174 160 171 164 L160 174 C156 177 151 176 148 171 L126 146 Z" 
          fill="url(#leafCapRight)" stroke="#1a3415" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M168 152 L137 138" stroke="#1c3616" stroke-width="1.5" opacity="0.8" />

    <!-- Right Tied Bamboo String Knots & Loop -->
    <path d="M148 140 C156 146 166 152 174 148 C180 144 182 134 176 130 C168 126 158 132 144 134" 
          stroke="url(#bambooString)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M152 144 C162 156 176 172 184 170 C190 168 188 158 180 152" 
          stroke="#9a6c1e" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- 5. Tightly Bound Bamboo Ties Along the Body (ចំណងបន្ទះឫស្សី) -->
    <!-- Tie 1 (near top-left) -->
    <g>
      <!-- Shadow under tie -->
      <path d="M60 48 Q72 58 84 46" stroke="#162e12" stroke-width="5" stroke-linecap="round" opacity="0.6" />
      <path d="M60 48 Q72 58 84 46" stroke="url(#bambooString)" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="60" cy="48" r="2.5" fill="#fef08a" stroke="#854d0e" stroke-width="1" />
    </g>

    <!-- Tie 2 -->
    <g>
      <path d="M78 66 Q90 76 102 64" stroke="#162e12" stroke-width="5" stroke-linecap="round" opacity="0.6" />
      <path d="M78 66 Q90 76 102 64" stroke="url(#bambooString)" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Tie 3 (Center) -->
    <g>
      <path d="M96 84 Q108 94 120 82" stroke="#162e12" stroke-width="5" stroke-linecap="round" opacity="0.6" />
      <path d="M96 84 Q108 94 120 82" stroke="url(#bambooString)" stroke-width="3.5" stroke-linecap="round" />
      <!-- Central Knot -->
      <ellipse cx="108" cy="91" rx="2.5" ry="3.5" fill="#fef08a" stroke="#854d0e" stroke-width="1" transform="rotate(-30 108 91)" />
    </g>

    <!-- Tie 4 -->
    <g>
      <path d="M114 102 Q126 112 138 100" stroke="#162e12" stroke-width="5" stroke-linecap="round" opacity="0.6" />
      <path d="M114 102 Q126 112 138 100" stroke="url(#bambooString)" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Tie 5 (near bottom-right) -->
    <g>
      <path d="M132 120 Q144 130 156 118" stroke="#162e12" stroke-width="5" stroke-linecap="round" opacity="0.6" />
      <path d="M132 120 Q144 130 156 118" stroke="url(#bambooString)" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="156" cy="118" r="2.5" fill="#fef08a" stroke="#854d0e" stroke-width="1" />
    </g>

    <!-- 6. Cut Cross-Section Slice (ចំណិតនំអន្សមជ្រូក បង្ហាញស្នូល ៣ ជាន់) -->
    <!-- Positioned elegantly at bottom left -->
    <g transform="translate(18, 102) rotate(-10)">
      <!-- Outer banana leaf rim of slice -->
      <ellipse cx="38" cy="38" rx="28" ry="24" fill="#2d5825" stroke="#173313" stroke-width="2.5" />
      
      <!-- Sticky rice outer ring (អង្ករដំណើប) -->
      <ellipse cx="38" cy="38" rx="25" ry="21" fill="url(#riceCrossSection)" stroke="#ab9f82" stroke-width="0.8" />
      
      <!-- Grains texture in sticky rice -->
      <ellipse cx="25" cy="35" rx="3.5" ry="2" fill="#fff" opacity="0.8" transform="rotate(25 25 35)" />
      <ellipse cx="48" cy="25" rx="3.5" ry="2" fill="#fff" opacity="0.8" transform="rotate(-35 48 25)" />
      <ellipse cx="52" cy="45" rx="3.5" ry="2" fill="#fff" opacity="0.8" transform="rotate(40 52 45)" />
      <ellipse cx="30" cy="48" rx="3.5" ry="2" fill="#fff" opacity="0.8" transform="rotate(-15 30 48)" />
      
      <!-- Steamed yellow mung bean filling (សណ្តែកបាយ) -->
      <ellipse cx="38" cy="38" rx="16" ry="13" fill="url(#mungBeanPaste)" stroke="#a16207" stroke-width="0.7" />

      <!-- Savory Pork Belly Core (សាច់ជ្រូក ៣ ជាន់) -->
      <path d="M31 35 C31 31 35 30 41 31 C46 32 47 36 46 41 C45 45 38 47 33 44 C30 42 31 38 31 35 Z" 
            fill="url(#porkBellyCore)" stroke="#7c2d12" stroke-width="0.8" />

      <!-- Pork Fat Layer Shimmer -->
      <ellipse cx="36" cy="34" rx="3.5" ry="2" fill="#ffedd5" opacity="0.9" />

      <!-- Kampot Black Pepper Specks (គ្រាប់ម្រេចកំពតបុក) -->
      <circle cx="34" cy="39" r="1.3" fill="#1c1917" />
      <circle cx="42" cy="35" r="1.1" fill="#1c1917" />
      <circle cx="39" cy="43" r="1.2" fill="#1c1917" />
      <circle cx="44" cy="40" r="1" fill="#1c1917" />
      <circle cx="32" cy="43" r="0.9" fill="#1c1917" />
    </g>
  </g>
</svg>
